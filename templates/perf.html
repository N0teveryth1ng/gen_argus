











<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    body {
        background: linear-gradient(135deg, #07111f 0%, #0f172a 55%, #111827 100%);
        color: #e5eefc;
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 2rem;
    }

    .page-shell {
        max-width: 1100px;
        margin: 0 auto;
    }

    .page-header {
        margin-bottom: 1.5rem;
    }

    .page-header h1 {
        font-size: 1.8rem;
        margin-bottom: 0.35rem;
    }

    .page-header p {
        color: #86a0c9;
        margin: 0;
    }

    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem;
    }

    .metric-card {
        background: rgba(15, 25, 50, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(56, 130, 210, 0.12);
        border-radius: 18px;
        padding: 1.5rem 1.25rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        position: relative;
        overflow: hidden;
    }

    .metric-card::after {
        content: '';
        position: absolute;
        top: -30px;
        right: -30px;
        width: 90px;
        height: 90px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%);
        pointer-events: none;
    }

    .metric-card h3 {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #6b83a8;
        margin-bottom: 1rem;
    }

    .progress-bar-container {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 0.75rem;
        position: relative;
    }

    .progress-bar {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }

    .progress-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
        animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
        0% { left: -60%; }
        100% { left: 120%; }
    }

    .metric-value {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #e8f0fe;
        line-height: 1;
        margin: 0;
    }

    .metric-unit {
        display: block;
        font-size: 0.75rem;
        font-weight: 500;
        color: #6b83a8;
        letter-spacing: 0.06em;
        margin-top: 0.4rem;
    }

    .metric-meta {
        margin-top: 0.8rem;
        color: #86a0c9;
        font-size: 0.92rem;
    }
</style>

<div class="page-shell">
    <div class="page-header">
        <h1>System Performance Monitor</h1>
        <p>Live metrics for the Gen Argus application.</p>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <h3>Server CPU Usage</h3>
            <div class="progress-bar-container">
                <div id="cpu-bar" class="progress-bar" style="width: 0%;"></div>
            </div>
            <p id="cpu-text" class="metric-value">0%</p>
            <span class="metric-unit">current load</span>
        </div>

        <div class="metric-card">
            <h3>Server RAM Usage</h3>
            <div class="progress-bar-container">
                <div id="ram-bar" class="progress-bar" style="width: 0%;"></div>
            </div>
            <p id="ram-text" class="metric-value">0%</p>
            <span class="metric-unit">memory usage</span>
        </div>

        <div class="metric-card">
            <h3>Avg Ingest Latency</h3>
            <h2 id="latency-text" class="metric-value">0.00 ms</h2>
            <span class="metric-unit">milliseconds</span>
        </div>

        <div class="metric-card">
            <h3>Total Requests</h3>
            <h2 id="requests-text" class="metric-value">0</h2>
            <div class="metric-meta">Counted from the live app requests</div>
        </div>
    </div>
</div>

<script>
    async function loadMetrics() {
        try {
            const response = await fetch('/api/perf-metrics');
            if (!response.ok) throw new Error('Failed to load metrics');
            const data = await response.json();

            document.getElementById('cpu-bar').style.width = Math.max(0, Math.min(100, Number(data.server_cpu_percent) || 0)) + '%';
            document.getElementById('cpu-text').innerText = (Number(data.server_cpu_percent) || 0).toFixed(1) + '%';

            document.getElementById('ram-bar').style.width = Math.max(0, Math.min(100, Number(data.server_ram_percent) || 0)) + '%';
            document.getElementById('ram-text').innerText = (Number(data.server_ram_percent) || 0).toFixed(1) + '%';

            document.getElementById('latency-text').innerText = (Number(data.avg_api_latency_ms) || 0).toFixed(2) + ' ms';
            document.getElementById('requests-text').innerText = Number(data.total_requests) || 0;
        } catch (error) {
            console.error(error);
        }
    }

    loadMetrics();
    setInterval(loadMetrics, 2000);
</script>
